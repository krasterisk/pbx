<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c1214" />
    <meta name="application-name" content="Krasterisk | AI PBX" />
    <meta name="description" content="Krasterisk | AI PBX. Система управления IP-АТС." />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Krasterisk | AI PBX" />
    <meta property="og:title" content="Krasterisk | AI PBX" />
    <meta property="og:description" content="Система управления IP-АТС и облачными коммуникациями." />
    <meta property="og:image" content="/brand/aipbx-logo.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Krasterisk | AI PBX" />
    <meta name="twitter:description" content="Система управления IP-АТС и облачными коммуникациями." />
    <meta name="twitter:image" content="/brand/aipbx-logo.png" />
    <title>Krasterisk | AI PBX</title>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png?v=2" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        const theme = localStorage.getItem('theme');
        const root = document.documentElement;
        if (theme === 'light') {
          root.classList.remove('dark');
          root.classList.add('light');
          const color = document.querySelector('meta[name="theme-color"]');
          if (color) color.setAttribute('content', '#f4f6fb');
        } else {
          root.classList.add('dark');
          root.classList.remove('light');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
