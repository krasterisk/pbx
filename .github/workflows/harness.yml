# Pre-Asterisk MVP CI gate (D-09/D-24). Evolved from e2e.yml — Node 22, harness working-directory.
# e2e.yml is superseded by this workflow (Phase 11, 2026-08). Remove e2e.yml only after this job is green.
name: harness

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  harness:
    name: Harness (API + Playwright Chromium)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CI_SEED_PASSWORD: disposable-ci-seed-password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: krasterisk
          MYSQL_DATABASE: krasterisk_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace deps
        run: npm ci

      - name: Build shared + backend + frontend
        run: npm run build

      - name: Run database migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: krasterisk
          DB_NAME: krasterisk_ci
        run: npm run db:migrate

      - name: Seed isolated CI admin
        env:
          CI: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: krasterisk
          DB_NAME: krasterisk_ci
        run: npm run db:seed:ci -w @krasterisk/backend

      - name: Start backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: krasterisk
          DB_NAME: krasterisk_ci
          JWT_SECRET: ci-test-secret-for-isolated-harness-only-32chars
          CC_AI_KEY_SECRET: ci-test-ai-secret
        run: |
          npm run dev:backend &
          npx wait-on -t 60000 http://localhost:5010/api/health

      - name: Start frontend
        run: |
          npm run dev:frontend &
          npx wait-on -t 60000 http://localhost:3010

      - name: Install Playwright browsers
        working-directory: harness
        run: npx playwright install --with-deps chromium

      - name: Run harness suite
        working-directory: harness
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3010
          HARNESS_API_URL: http://localhost:5010
          # Tenant admin (level 1) — platform admin is blocked from /callcenter/supervisor.
          PW_USER: ci-tenant-a
          PW_PASS: ${{ env.CI_SEED_PASSWORD }}
          JWT_SECRET: ci-test-secret-for-isolated-harness-only-32chars
          CC_AI_KEY_SECRET: ci-test-ai-secret
          # HARNESS_LIVE_LLM stays unset — CI uses the OpenAI stub, not a paid/local model
        run: npm test

      - name: Upload harness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-reports
          path: |
            harness/playwright-report
            harness/reports
          retention-days: 14
