name: Linux release bundle
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ONNXRUNTIME_NODE_INSTALL: 'skip'
jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run build -w @krasterisk/shared
      - run: npm run build -w @krasterisk/backend
      - run: npm run build -w @krasterisk/frontend -- --base=/v4/
      - name: Keep only runtime dependencies
        # Native install hooks already ran in npm ci; shared/prepare must not rebuild after dev types are removed.
        run: npm prune --omit=dev --ignore-scripts --workspace=@krasterisk/backend --workspace=@krasterisk/shared --include-workspace-root --no-audit --no-fund
      - name: Verify runtime packages
        run: node -e "require('bcrypt').hashSync('synthetic-runtime-probe',4); require('mysql2'); require('@krasterisk/shared')"
      - name: Package exact revision
        run: |
          printf '%s\n' "$GITHUB_SHA" > RELEASE_SHA
          mkdir -p release
          tar -czf release/krasterisk-linux.tgz node_modules package.json package-lock.json RELEASE_SHA packages/backend packages/shared packages/frontend/dist packages/frontend/package.json
          sha256sum release/krasterisk-linux.tgz > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: krasterisk-linux-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
