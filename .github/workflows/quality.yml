name: quality
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
# Hosted runners use the CPU binaries bundled with onnxruntime-node.
# Avoid the optional CUDA/NuGet download (no GPU on these runners).
env:
  ONNXRUNTIME_NODE_INSTALL: 'skip'

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test -w @krasterisk/shared -- --runInBand
      - run: npm run test -w @krasterisk/backend -- --runInBand
      - run: npm run test:frontend
      - run: npm run build
