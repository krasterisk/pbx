; Isolated lab PJSIP snippet (loopback transports / disposable endpoints).
; Install to /etc/asterisk/pjsip.d/ai-lab.conf — NOT under
; krasterisk/<dir>/*.conf, because extensions.conf glob-includes that tree
; as dialplan.

[transport-ai-lab]
type=transport
protocol=udp
bind=127.0.0.1:15060

; Disposable lab TLS — loopback only. Does not bind public 5061.
; Uses existing /etc/asterisk/keys/asterisk.{pem,key}. Not a NAT/SRTP media claim.
[transport-ai-lab-tls]
type=transport
protocol=tls
bind=127.0.0.1:15061
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
verify_server=no
verify_client=no
allow_reload=yes

[ai-lab-a]
type=endpoint
context=krasterisk-ai-lab
disallow=all
allow=ulaw
direct_media=no
auth=ai-lab-a-auth
aors=ai-lab-a
outbound_auth=ai-lab-a-auth
transport=transport-ai-lab

[ai-lab-a-auth]
type=auth
auth_type=userpass
username=ai-lab-a
password=ai-lab-a-secret

[ai-lab-a]
type=aor
max_contacts=1
remove_existing=yes

[ai-lab-tls]
type=endpoint
context=krasterisk-ai-lab
disallow=all
allow=ulaw
direct_media=no
auth=ai-lab-tls-auth
aors=ai-lab-tls
media_encryption=sdes
transport=transport-ai-lab-tls

[ai-lab-tls-auth]
type=auth
auth_type=userpass
username=ai-lab-tls
password=ai-lab-tls-secret

[ai-lab-tls]
type=aor
max_contacts=1
remove_existing=yes
