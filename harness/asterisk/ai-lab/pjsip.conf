[transport-ai-lab]
type=transport
protocol=udp
bind=127.0.0.1:15060

[ai-lab-a]
type=endpoint
context=krasterisk-ai-lab
disallow=all
allow=ulaw
direct_media=no
auth=ai-lab-a-auth
aors=ai-lab-a
outbound_auth=ai-lab-a-auth

[ai-lab-a-auth]
type=auth
auth_type=userpass
username=ai-lab-a
password=ai-lab-a-secret

[ai-lab-a]
type=aor
max_contacts=1
remove_existing=yes
