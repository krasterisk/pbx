[krasterisk-ai-lab]
exten => wait,1,NoOp(other Local leg)
 same => n,Answer()
 same => n,Wait(8)
 same => n,Hangup()

exten => inbound,1,NoOp(inbound MixMonitor)
 same => n,Answer()
 same => n,Set(AI_LAB_FILE=/var/spool/asterisk/monitor/krasterisk-ai-lab/inbound-${UNIQUEID})
 same => n,MixMonitor(${AI_LAB_FILE}.wav)
 same => n,Playback(demo-thanks)
 same => n,StopMixMonitor()
 same => n,Hangup()

exten => outbound,1,NoOp(outbound MixMonitor)
 same => n,Answer()
 same => n,Set(AI_LAB_FILE=/var/spool/asterisk/monitor/krasterisk-ai-lab/outbound-${UNIQUEID})
 same => n,MixMonitor(${AI_LAB_FILE}.wav)
 same => n,Playback(demo-thanks)
 same => n,StopMixMonitor()
 same => n,Hangup()

exten => ivr,1,NoOp(IVR then MixMonitor)
 same => n,Answer()
 same => n,Playback(demo-thanks)
 same => n,Set(AI_LAB_FILE=/var/spool/asterisk/monitor/krasterisk-ai-lab/ivr-${UNIQUEID})
 same => n,MixMonitor(${AI_LAB_FILE}.wav)
 same => n,Wait(1)
 same => n,StopMixMonitor()
 same => n,Hangup()

exten => robot,1,NoOp(robot playback plus MixMonitor)
 same => n,Answer()
 same => n,Set(AI_LAB_FILE=/var/spool/asterisk/monitor/krasterisk-ai-lab/robot-${UNIQUEID})
 same => n,MixMonitor(${AI_LAB_FILE}.wav)
 same => n,Playback(demo-thanks)
 same => n,StopMixMonitor()
 same => n,Hangup()

exten => transfer,1,NoOp(transfer into inbound MixMonitor)
 same => n,Answer()
 same => n,Dial(Local/inbound@krasterisk-ai-lab,8)

exten => pause,1,NoOp(analytics pause must not drop the call)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Hangup()

exten => sip-echo,1,NoOp(SIP answer hangup)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Hangup()
