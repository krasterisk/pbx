; Transports only. Endpoints, trunks and auths come from realtime.
[global]
type = global
user_agent = Krasterisk
default_realm = asterisk
endpoint_identifier_order = username,ip,anonymous

[system]
type = system
timer_t1 = 500
timer_b = 32000

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
allow_reload = yes
