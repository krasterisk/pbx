<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Spike 002 — ConfBridge SFU grid</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d11; color: #e6e8ec; font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #222733; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .who { color: #7dd3fc; font-weight: 600; }
  button { background: #1f2937; color: #e6e8ec; border: 1px solid #374151; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: #374151; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #2563eb; border-color: #3b82f6; }
  .state { margin-left: auto; font-variant-numeric: tabular-nums; color: #9ca3af; }
  main { display: grid; grid-template-columns: 1fr 420px; height: calc(100vh - 53px); }
  #grid { display: grid; gap: 8px; padding: 12px; align-content: start;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); overflow: auto; }
  .tile { position: relative; background: #11151c; border: 1px solid #222733; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; }
  .tile video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  .tile .label { position: absolute; left: 6px; bottom: 6px; background: #000a; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .tile.local { outline: 2px solid #2563eb; outline-offset: -2px; }
  aside { border-left: 1px solid #222733; display: flex; flex-direction: column; min-width: 0; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #9ca3af; margin: 0; padding: 10px 12px; border-bottom: 1px solid #222733; }
  #diag { padding: 10px 12px; border-bottom: 1px solid #222733; max-height: 40%; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #1b2029; }
  th { color: #9ca3af; font-weight: 500; }
  td.live { color: #4ade80; }
  td.idle { color: #6b7280; }
  #log { flex: 1; overflow: auto; padding: 8px 12px; font: 11px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
  .log-sip { color: #a5b4fc; } .log-rtc { color: #6ee7b7; } .log-err { color: #fca5a5; } .log-ui { color: #9ca3af; }
</style>
</head>
<body>
<header>
  <h1>Spike 002 — ConfBridge <code>video_mode=sfu</code></h1>
  <span class="who" id="who">—</span>
  <button class="primary" id="join">Войти в комнату</button>
  <button id="leave" disabled>Выйти</button>
  <button id="cam" disabled>Выключить камеру</button>
  <button id="export">Выгрузить лог</button>
  <span class="state" id="state">idle</span>
</header>
<main>
  <div id="grid">
    <div class="tile local"><video id="localVideo" autoplay playsinline muted></video><span class="label">я (локально)</span></div>
  </div>
  <aside>
    <h2>Трансиверы (видео m-lines)</h2>
    <div id="diag"><table id="diagTable"><thead><tr><th>mid</th><th>kind</th><th>direction</th><th>current</th><th>track</th></tr></thead><tbody></tbody></table></div>
    <h2>Журнал</h2>
    <div id="log"></div>
  </aside>
</main>
<audio id="remoteAudio" autoplay></audio>
<script src="/sip.bundle.js"></script>
<script src="/app.js"></script>
</body>
</html>
