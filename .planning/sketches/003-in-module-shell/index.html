<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketch 003 — In-module shell</title>
  <link rel="stylesheet" href="../themes/default.css" />
  <style>
    body { padding-top: 52px; padding-bottom: 48px; min-height: 100vh; }
    #variant-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
      background: var(--color-surface); border-bottom: 1px solid var(--color-border);
      padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .variant-tab {
      padding: 8px 14px; border: 1px solid var(--color-border); border-radius: var(--radius-md);
      background: var(--color-surface); color: var(--color-text); cursor: pointer; font-size: var(--text-sm);
    }
    .variant-tab.active {
      background: var(--color-indigo-muted); border-color: var(--color-indigo); color: var(--color-indigo);
    }
    #variant-nav .hint { margin-left: auto; font-size: var(--text-xs); color: var(--color-text-muted); }
    .variant { display: none; }
    .variant.active { display: block; }
    #sketch-viewport { transition: max-width 0.2s; margin: 0 auto; min-height: calc(100vh - 100px); }

    .shell { min-height: calc(100vh - 100px); display: flex; flex-direction: column; }
    .topbar {
      height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
      border-bottom: 1px solid var(--color-border); background: rgba(15,15,20,0.85);
      backdrop-filter: blur(12px); position: sticky; top: 52px; z-index: 40;
    }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; border: none;
      background: var(--color-indigo-muted); color: var(--color-indigo);
      font-weight: 800; cursor: pointer; display: grid; place-items: center;
    }
    .logo:hover { filter: brightness(1.1); }
    .chip {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px;
      border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-surface);
      color: var(--color-text); cursor: pointer; font-size: var(--text-sm);
    }
    .chip:hover { border-color: var(--color-indigo); }
    .chip .chev { color: var(--color-text-muted); font-size: 10px; }
    .spacer { flex: 1; }
    .cmd {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; min-width: 160px;
      border-radius: 8px; border: 1px solid var(--color-border); background: rgba(255,255,255,0.03);
      color: var(--color-text-muted); font-size: var(--text-sm); cursor: pointer;
    }
    .cmd kbd {
      margin-left: auto; font-size: 10px; padding: 2px 6px; border-radius: 4px;
      border: 1px solid var(--color-border);
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 999px; background: rgba(255,255,255,0.08);
      display: grid; place-items: center; font-size: 12px; color: var(--color-text-muted);
    }

    .body { display: flex; flex: 1; min-height: 0; }
    .side {
      width: 240px; border-right: 1px solid var(--color-border);
      background: var(--color-surface); padding: 12px; display: flex; flex-direction: column; gap: 4px;
      transition: width 0.2s ease;
    }
    .side.collapsed { width: 64px; }
    .side .nav-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--color-text-muted); padding: 8px 10px 4px;
    }
    .side.collapsed .nav-label, .side.collapsed .nav-text { display: none; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; border: none; border-radius: 8px; background: transparent;
      color: var(--color-text-muted); cursor: pointer; font-size: var(--text-sm); text-align: left;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--color-text); }
    .nav-item.active { background: var(--color-indigo-muted); color: var(--color-indigo); }
    .nav-ico { width: 20px; text-align: center; flex-shrink: 0; }
    .collapse-btn {
      margin-top: auto; padding: 8px; border: 1px solid var(--color-border); border-radius: 8px;
      background: transparent; color: var(--color-text-muted); cursor: pointer; font-size: 12px;
    }

    .main { flex: 1; padding: 24px; min-width: 0; }
    .page-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .page-h h2 { margin: 0; font-size: 1.25rem; }
    .page-h p { margin: 4px 0 0; font-size: var(--text-sm); color: var(--color-text-muted); }
    .btn {
      padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: var(--text-sm);
      background: var(--color-primary); color: #fff; box-shadow: var(--shadow-primary);
    }
    .card {
      border: 1px solid var(--color-border-muted); border-radius: var(--radius-lg);
      background: rgba(15,15,20,0.5); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--color-border); text-align: left; }
    th { color: var(--color-text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:hover td { background: rgba(255,255,255,0.03); }

    /* B — tabs */
    .tabs {
      display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--color-border);
      background: var(--color-surface); overflow-x: auto;
    }
    .tab {
      padding: 12px 14px; border: none; background: transparent; color: var(--color-text-muted);
      cursor: pointer; font-size: var(--text-sm); border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .tab:hover { color: var(--color-text); }
    .tab.active { color: var(--color-indigo); border-bottom-color: var(--color-indigo); }
    .v-b .body { flex-direction: column; }

    /* C — icon rail */
    .rail {
      width: 56px; border-right: 1px solid var(--color-border); background: var(--color-surface);
      padding: 10px 6px; display: flex; flex-direction: column; gap: 4px; position: relative;
    }
    .rail:hover { width: 200px; }
    .rail .nav-item { justify-content: flex-start; }
    .rail:not(:hover) .nav-text { opacity: 0; width: 0; overflow: hidden; }
    .rail .nav-text { white-space: nowrap; transition: opacity 0.15s; }

    /* Overlays */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 80;
      display: none; align-items: flex-start; justify-content: center; padding-top: 12vh;
    }
    .overlay.open { display: flex; }
    .panel {
      width: min(480px, 92vw); background: var(--color-surface-elevated);
      border: 1px solid var(--color-border); border-radius: 14px; box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .panel-h { padding: 12px 14px; border-bottom: 1px solid var(--color-border); font-size: var(--text-sm); color: var(--color-text-muted); }
    .panel input {
      width: 100%; padding: 12px 14px; border: none; border-bottom: 1px solid var(--color-border);
      background: transparent; color: var(--color-text); font-size: var(--text-base); outline: none;
    }
    .panel-item {
      display: flex; gap: 10px; align-items: center; width: 100%; padding: 10px 14px;
      border: none; background: transparent; color: var(--color-text); cursor: pointer; text-align: left;
      font-size: var(--text-sm);
    }
    .panel-item:hover, .panel-item.active { background: var(--color-indigo-muted); }
    .panel-item small { color: var(--color-text-muted); margin-left: auto; }
    .switcher-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px;
    }
    .switcher-grid button {
      padding: 12px; border-radius: 10px; border: 1px solid var(--color-border);
      background: var(--color-surface); color: var(--color-text); cursor: pointer; text-align: left;
    }
    .switcher-grid button:hover { border-color: var(--color-indigo); }
    .switcher-grid button.active { border-color: var(--color-indigo); background: var(--color-indigo-muted); }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--color-surface-elevated); border: 1px solid var(--color-border);
      padding: 10px 16px; border-radius: 10px; font-size: var(--text-sm);
      opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 90;
    }
    .toast.show { opacity: 1; }

    #sketch-tools {
      position: fixed; bottom: 12px; right: 12px; z-index: 9999;
      font-family: system-ui; font-size: 12px; background: rgba(0,0,0,0.75); color: white;
      padding: 8px 12px; border-radius: 8px; opacity: 0.4; transition: opacity 0.2s;
      display: flex; gap: 8px; align-items: center;
    }
    #sketch-tools:hover { opacity: 1; }
    #sketch-tools button {
      background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; cursor: pointer;
    }

    @media (max-width: 700px) {
      .side { position: fixed; z-index: 30; height: calc(100% - 108px); top: 108px; transform: translateX(-100%); }
      .side.open { transform: translateX(0); }
      .rail { display: none; }
    }
  </style>
</head>
<body>
  <div id="variant-nav">
    <button type="button" class="variant-tab active" data-v="a">A: Dense sidebar</button>
    <button type="button" class="variant-tab" data-v="b">B: Top tabs ★ Selected</button>
    <button type="button" class="variant-tab" data-v="c">C: Compact icon rail</button>
    <span class="hint">Phase 8 · after Hub E · logo→Hub · chip · ⌘K</span>
  </div>

  <div id="sketch-viewport">
    <section id="variant-a" class="variant active shell v-a" data-variant="a"></section>
    <section id="variant-b" class="variant shell v-b" data-variant="b"></section>
    <section id="variant-c" class="variant shell v-c" data-variant="c"></section>
  </div>

  <div class="overlay" id="palette">
    <div class="panel">
      <div class="panel-h">Command palette · modules + pages</div>
      <input id="palette-input" type="search" placeholder="Перейти к…" autocomplete="off" />
      <div id="palette-list"></div>
    </div>
  </div>

  <div class="overlay" id="switcher">
    <div class="panel">
      <div class="panel-h">Module switcher · mini Hub (list style, as 002-E)</div>
      <div class="switcher-grid" id="switcher-grid"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="sketch-tools">
    <button type="button" onclick="setViewport(375)">Phone</button>
    <button type="button" onclick="setViewport(768)">Tablet</button>
    <button type="button" onclick="setViewport(null)">Desktop</button>
  </div>

  <script>
    const MODULE = {
      id: 'core',
      name: 'Core / PBX',
      pages: [
        { id: 'endpoints', name: 'Endpoints', icon: '☎' },
        { id: 'contexts', name: 'Contexts', icon: '⧉' },
        { id: 'trunks', name: 'Trunks', icon: '⇄' },
        { id: 'routes', name: 'Routes', icon: '⇢' },
        { id: 'time', name: 'Time groups', icon: '◷' },
        { id: 'phonebooks', name: 'Phonebooks', icon: '☰' },
        { id: 'settings', name: 'Module settings', icon: '⚙' },
      ],
    };
    const MODULES = [
      { id: 'overview', name: 'Обзор' },
      { id: 'core', name: 'Core / PBX' },
      { id: 'apps', name: 'Apps' },
      { id: 'system', name: 'System' },
      { id: 'cc', name: 'Call Center', locked: true },
    ];

    let currentPage = 'endpoints';
    let collapsed = false;

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1400);
    }

    function topbarHtml() {
      return `
        <header class="topbar">
          <button type="button" class="logo" data-action="hub" title="Module Hub">K</button>
          <button type="button" class="chip" data-action="switcher">
            <span>${MODULE.name}</span><span class="chev">▼</span>
          </button>
          <div class="spacer"></div>
          <button type="button" class="cmd" data-action="palette">Search… <kbd>⌘K</kbd></button>
          <div class="avatar">AD</div>
        </header>`;
    }

    function mainHtml() {
      const page = MODULE.pages.find((p) => p.id === currentPage) || MODULE.pages[0];
      return `
        <main class="main">
          <div class="page-h">
            <div>
              <h2>${page.name}</h2>
              <p>In-module page · registry-driven nav · Hub winner E (minimal)</p>
            </div>
            <button type="button" class="btn" data-action="create">Создать</button>
          </div>
          <div class="card">
            <table>
              <thead><tr><th>Name</th><th>Status</th><th>Updated</th></tr></thead>
              <tbody>
                <tr><td>1001 · Alice</td><td>Online</td><td>2 мин назад</td></tr>
                <tr><td>1002 · Bob</td><td>Offline</td><td>вчера</td></tr>
                <tr><td>1003 · Carol</td><td>Online</td><td>сегодня</td></tr>
              </tbody>
            </table>
          </div>
        </main>`;
    }

    function navItems(activeId) {
      return MODULE.pages.map((p) => `
        <button type="button" class="nav-item ${p.id === activeId ? 'active' : ''}" data-page="${p.id}">
          <span class="nav-ico">${p.icon}</span><span class="nav-text">${p.name}</span>
        </button>`).join('');
    }

    function renderA(root) {
      root.innerHTML = `
        ${topbarHtml()}
        <div class="body">
          <aside class="side ${collapsed ? 'collapsed' : ''}">
            <div class="nav-label">PBX</div>
            ${navItems(currentPage)}
            <button type="button" class="collapse-btn" data-action="collapse">${collapsed ? '»' : '« Свернуть'}</button>
          </aside>
          ${mainHtml()}
        </div>`;
      bindShell(root);
    }

    function renderB(root) {
      root.innerHTML = `
        ${topbarHtml()}
        <div class="tabs">
          ${MODULE.pages.map((p) => `
            <button type="button" class="tab ${p.id === currentPage ? 'active' : ''}" data-page="${p.id}">${p.name}</button>
          `).join('')}
        </div>
        <div class="body">${mainHtml()}</div>`;
      bindShell(root);
    }

    function renderC(root) {
      root.innerHTML = `
        ${topbarHtml()}
        <div class="body">
          <aside class="rail" title="Hover to expand">
            ${navItems(currentPage)}
          </aside>
          ${mainHtml()}
        </div>`;
      bindShell(root);
    }

    function bindShell(root) {
      root.querySelectorAll('[data-page]').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentPage = btn.dataset.page;
          remountActive();
          toast('Page → ' + currentPage);
        });
      });
      root.querySelectorAll('[data-action="hub"]').forEach((b) => {
        b.addEventListener('click', () => toast('Logo → Module Hub (002-E list)'));
      });
      root.querySelectorAll('[data-action="switcher"]').forEach((b) => {
        b.addEventListener('click', () => openOverlay('switcher'));
      });
      root.querySelectorAll('[data-action="palette"]').forEach((b) => {
        b.addEventListener('click', () => openOverlay('palette'));
      });
      root.querySelectorAll('[data-action="collapse"]').forEach((b) => {
        b.addEventListener('click', () => { collapsed = !collapsed; remountActive(); });
      });
      root.querySelectorAll('[data-action="create"]').forEach((b) => {
        b.addEventListener('click', () => toast('Create… (fake)'));
      });
    }

    function remountActive() {
      const active = document.querySelector('.variant.active');
      const v = active.dataset.variant;
      if (v === 'a') renderA(active);
      if (v === 'b') renderB(active);
      if (v === 'c') renderC(active);
    }

    function openOverlay(id) {
      document.getElementById(id).classList.add('open');
      if (id === 'palette') {
        const input = document.getElementById('palette-input');
        input.value = '';
        renderPalette('');
        setTimeout(() => input.focus(), 50);
      }
    }
    function closeOverlays() {
      document.querySelectorAll('.overlay').forEach((o) => o.classList.remove('open'));
    }

    function renderPalette(q) {
      const list = document.getElementById('palette-list');
      const qq = q.trim().toLowerCase();
      const rows = [
        ...MODULES.map((m) => ({ kind: 'module', id: m.id, name: m.name, locked: m.locked })),
        ...MODULE.pages.map((p) => ({ kind: 'page', id: p.id, name: p.name })),
      ].filter((r) => !qq || r.name.toLowerCase().includes(qq));
      list.innerHTML = rows.map((r) => `
        <button type="button" class="panel-item" data-kind="${r.kind}" data-id="${r.id}">
          <span>${r.kind === 'module' ? '▦' : '→'}</span>
          <span>${r.name}</span>
          <small>${r.locked ? 'Locked' : r.kind}</small>
        </button>`).join('') || '<div class="panel-h">Ничего не найдено</div>';
      list.querySelectorAll('.panel-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          closeOverlays();
          if (btn.dataset.kind === 'page') {
            currentPage = btn.dataset.id;
            remountActive();
          }
          toast((btn.dataset.kind === 'module' ? 'Module → ' : 'Page → ') + btn.dataset.id);
        });
      });
    }

    document.getElementById('palette-input').addEventListener('input', (e) => renderPalette(e.target.value));
    document.querySelectorAll('.overlay').forEach((o) => {
      o.addEventListener('click', (e) => { if (e.target === o) closeOverlays(); });
    });
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openOverlay('palette');
      }
      if (e.key === 'Escape') closeOverlays();
    });

    const grid = document.getElementById('switcher-grid');
    grid.innerHTML = MODULES.map((m) => `
      <button type="button" class="${m.id === MODULE.id ? 'active' : ''}" data-mod="${m.id}">
        <strong>${m.name}</strong><br>
        <span style="font-size:11px;color:var(--color-text-muted)">${m.locked ? 'Locked' : 'Enter'}</span>
      </button>`).join('');
    grid.querySelectorAll('button').forEach((b) => {
      b.addEventListener('click', () => {
        closeOverlays();
        toast(MODULES.find((m) => m.id === b.dataset.mod)?.locked ? 'Locked module' : 'Switch → ' + b.dataset.mod);
      });
    });

    document.querySelectorAll('.variant-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.variant-tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.variant').forEach((v) => v.classList.remove('active'));
        document.getElementById('variant-' + tab.dataset.v).classList.add('active');
        remountActive();
      });
    });

    function setViewport(w) {
      const vp = document.getElementById('sketch-viewport');
      if (!w) { vp.style.maxWidth = ''; vp.style.border = ''; return; }
      vp.style.maxWidth = w + 'px';
      vp.style.border = '1px solid var(--color-border)';
      vp.style.borderRadius = '12px';
    }

    remountActive();
  </script>
</body>
</html>
