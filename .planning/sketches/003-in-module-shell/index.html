<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketch 003 — In-module shell (A+C hybrid)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: #0a0a0c; color: #fafafa;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #banner {
      flex-shrink: 0; padding: 10px 16px; background: #121214; border-bottom: 1px solid #27272a;
      font-size: 13px; color: #a1a1aa;
    }
    #banner strong { color: #a5b4fc; }
    #app {
      flex: 1; min-height: 0; display: flex; flex-direction: row;
    }

    /* Full-height sidebar (A density + C icon collapse) */
    .sidebar {
      width: 240px; flex-shrink: 0; display: flex; flex-direction: column;
      border-right: 1px solid #27272a; background: #121214; min-height: 0;
      transition: width 0.2s ease;
    }
    .sidebar.collapsed { width: 64px; }
    .sidebar.collapsed .nav-text,
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .foot-label { display: none; }
    .sidebar-nav {
      flex: 1; overflow-y: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px;
    }
    .nav-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: #71717a; padding: 8px 10px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      min-height: 44px; padding: 9px 10px; border: none; border-radius: 8px;
      background: transparent; color: #a1a1aa; cursor: pointer; font-size: 14px; text-align: left;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: #fafafa; }
    .nav-item.active { background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .nav-ico { width: 20px; text-align: center; flex-shrink: 0; }
    .sidebar-foot {
      flex-shrink: 0; border-top: 1px solid #27272a; padding: 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .foot-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      min-height: 44px; padding: 9px 10px; border: 1px solid #27272a; border-radius: 8px;
      background: transparent; color: #a1a1aa; cursor: pointer; font-size: 13px; text-align: left;
    }
    .foot-btn:hover { border-color: #6366f1; color: #fafafa; }

    .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    .topbar {
      height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: 0 16px; border-bottom: 1px solid #27272a; background: rgba(18,18,20,0.95);
    }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; border: none;
      background: rgba(99,102,241,0.15); color: #6366f1; font-weight: 800;
      cursor: pointer; display: grid; place-items: center; flex-shrink: 0;
    }
    .crumbs {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0;
      font-size: 14px;
    }
    .crumbs a { color: #a1a1aa; text-decoration: none; }
    .crumbs a:hover { color: #a5b4fc; }
    .crumbs .sep { color: #52525b; }
    .crumbs .current { color: #fafafa; font-weight: 600; }
    .spacer { flex: 1; }
    .cmd {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px;
      border-radius: 8px; border: 1px solid #27272a; background: rgba(255,255,255,0.03);
      color: #a1a1aa; font-size: 13px; cursor: pointer;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 999px; background: rgba(255,255,255,0.08);
      display: grid; place-items: center; font-size: 12px; color: #a1a1aa;
    }
    .content { flex: 1; overflow: auto; padding: 24px; }
    .content h1 { margin: 0 0 8px; font-size: 1.35rem; }
    .content p { margin: 0 0 16px; color: #a1a1aa; font-size: 14px; }
    .card {
      border: 1px solid #27272a; border-radius: 12px; overflow: hidden; background: #121214;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #27272a; text-align: left; }
    th { color: #a1a1aa; font-size: 12px; text-transform: uppercase; }

    .mod-panel {
      position: absolute; left: 8px; bottom: 64px; width: 220px;
      background: #18181b; border: 1px solid #27272a; border-radius: 10px;
      padding: 6px; display: none; z-index: 20;
    }
    .mod-panel.open { display: block; }
    .mod-panel button {
      display: block; width: 100%; text-align: left; padding: 10px; border: none;
      border-radius: 8px; background: transparent; color: #fafafa; cursor: pointer; font-size: 13px;
    }
    .mod-panel button:hover { background: rgba(99,102,241,0.15); }

    @media (max-width: 768px) {
      .sidebar { width: 64px; }
      .sidebar .nav-text,
      .sidebar .nav-label,
      .sidebar .foot-label { display: none; }
    }
  </style>
</head>
<body>
  <div id="banner">
    Winner: <strong>A+C hybrid</strong> — full-height sidebar (icons+labels), collapse to rail,
    footer = modules + collapse · top = breadcrumb <strong>Главная → Раздел → Подраздел</strong>
    (not chip select). Mobile: auto-collapsed.
  </div>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-nav" id="nav"></div>
      <div class="sidebar-foot" style="position:relative">
        <div class="mod-panel" id="mod-panel"></div>
        <button type="button" class="foot-btn" id="mod-btn" title="Modules">
          <span class="nav-ico">▦</span><span class="foot-label">Модули</span>
        </button>
        <button type="button" class="foot-btn" id="collapse-btn" title="Collapse">
          <span class="nav-ico" id="collapse-ico">«</span><span class="foot-label">Свернуть</span>
        </button>
      </div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <button type="button" class="logo" id="logo" title="Hub">K</button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="spacer"></div>
        <button type="button" class="cmd">Search… <kbd style="margin-left:8px;border:1px solid #27272a;border-radius:4px;padding:2px 6px;font-size:10px">⌘K</kbd></button>
        <div class="avatar">AD</div>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>
  <script>
    (function () {
      var pages = [
        { id: 'endpoints', name: 'Endpoints', icon: '☎' },
        { id: 'contexts', name: 'Contexts', icon: '⧉' },
        { id: 'trunks', name: 'Trunks', icon: '⇄' },
        { id: 'routes', name: 'Routes', icon: '⇢' },
        { id: 'time', name: 'Time groups', icon: '◷' },
        { id: 'phonebooks', name: 'Phonebooks', icon: '☰' },
        { id: 'settings', name: 'Module settings', icon: '⚙' }
      ];
      var modules = [
        { id: 'core', name: 'Core / PBX' },
        { id: 'apps', name: 'Apps' },
        { id: 'system', name: 'System' },
        { id: 'cc', name: 'Call Center' }
      ];
      var current = 'endpoints';
      var moduleName = 'Core / PBX';
      var sidebar = document.getElementById('sidebar');
      var collapsed = window.matchMedia('(max-width: 768px)').matches;

      function applyCollapse() {
        sidebar.classList.toggle('collapsed', collapsed);
        document.getElementById('collapse-ico').textContent = collapsed ? '»' : '«';
        document.querySelector('#collapse-btn .foot-label').textContent = collapsed ? 'Развернуть' : 'Свернуть';
      }

      function renderNav() {
        var html = '<div class="nav-label">PBX</div>';
        for (var i = 0; i < pages.length; i++) {
          var p = pages[i];
          html += '<button type="button" class="nav-item' + (p.id === current ? ' active' : '') + '" data-page="' + p.id + '">' +
            '<span class="nav-ico">' + p.icon + '</span><span class="nav-text">' + p.name + '</span></button>';
        }
        document.getElementById('nav').innerHTML = html;
        var btns = document.querySelectorAll('#nav [data-page]');
        for (var j = 0; j < btns.length; j++) {
          btns[j].addEventListener('click', function (e) {
            current = e.currentTarget.getAttribute('data-page');
            renderAll();
          });
        }
      }

      function renderCrumbs() {
        var page = pages.filter(function (p) { return p.id === current; })[0] || pages[0];
        document.getElementById('crumbs').innerHTML =
          '<a href="#" data-go="home">Главная</a>' +
          '<span class="sep">→</span>' +
          '<a href="#" data-go="module">' + moduleName + '</a>' +
          '<span class="sep">→</span>' +
          '<span class="current">' + page.name + '</span>';
        var links = document.querySelectorAll('#crumbs a');
        for (var i = 0; i < links.length; i++) {
          links[i].addEventListener('click', function (e) {
            e.preventDefault();
            alert(e.currentTarget.getAttribute('data-go') === 'home' ? '→ Module Hub' : '→ Module home');
          });
        }
      }

      function renderContent() {
        var page = pages.filter(function (p) { return p.id === current; })[0] || pages[0];
        document.getElementById('content').innerHTML =
          '<h1>' + page.name + '</h1>' +
          '<p>A+C hybrid · full-height sidebar · breadcrumb instead of chip</p>' +
          '<div class="card"><table><thead><tr><th>Name</th><th>Status</th><th>Updated</th></tr></thead>' +
          '<tbody><tr><td>1001 · Alice</td><td>Online</td><td>2 мин назад</td></tr>' +
          '<tr><td>1002 · Bob</td><td>Offline</td><td>вчера</td></tr>' +
          '<tr><td>1003 · Carol</td><td>Online</td><td>сегодня</td></tr></tbody></table></div>';
      }

      function renderMods() {
        document.getElementById('mod-panel').innerHTML = modules.map(function (m) {
          return '<button type="button" data-mod="' + m.id + '">' + m.name + '</button>';
        }).join('') + '<button type="button" data-mod="hub">Модули (Hub)</button>';
      }

      function renderAll() {
        applyCollapse();
        renderNav();
        renderCrumbs();
        renderContent();
      }

      document.getElementById('collapse-btn').addEventListener('click', function () {
        if (window.matchMedia('(max-width: 768px)').matches) return;
        collapsed = !collapsed;
        applyCollapse();
      });
      document.getElementById('mod-btn').addEventListener('click', function () {
        document.getElementById('mod-panel').classList.toggle('open');
      });
      document.getElementById('logo').addEventListener('click', function () {
        alert('Logo → Module Hub');
      });
      document.getElementById('mod-panel').addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        if (btn.getAttribute('data-mod') !== 'hub') {
          moduleName = btn.textContent;
        }
        document.getElementById('mod-panel').classList.remove('open');
        renderCrumbs();
      });
      window.matchMedia('(max-width: 768px)').addEventListener('change', function (e) {
        collapsed = e.matches ? true : collapsed;
        applyCollapse();
      });

      renderMods();
      renderAll();
    })();
  </script>
</body>
</html>
